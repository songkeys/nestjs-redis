name: Publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish from main
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v6
      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e "for (const name of ['redis', 'redis-health']) { const p = require('./packages/' + name + '/package.json'); if (p.version !== process.env.RELEASE_VERSION) throw new Error(p.name + ' version mismatch'); }"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter "@songkeys/nestjs-redis*" -r pack --pack-destination "$RUNNER_TEMP/npm-packages"
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in "$RUNNER_TEMP"/npm-packages/*.tgz; do
            npm publish "$package" --access public --provenance
          done
