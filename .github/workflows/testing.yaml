name: testing
on:
  pull_request:
    branches:
      - main
jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20
            dependencies: locked
          - node: 24
            dependencies: latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: docker compose exec -T cluster-1_master-1 redis-cli --cluster create 127.0.0.1:16380 127.0.0.1:16381 127.0.0.1:16382 --cluster-yes
      - run: docker compose exec -T cluster-2_master-1 redis-cli --cluster create 127.0.0.1:16480 127.0.0.1:16481 127.0.0.1:16482 --cluster-yes
      - run: pnpm -r lint
      - run: pnpm -r run test --runInBand
      - run: pnpm -r build
      - run: pnpm -r run test:e2e --runInBand
      - name: Install NestJS 12 and ioredis 6
        if: matrix.dependencies == 'latest'
        run: |
          pnpm add -Dw @nestjs/common@12 @nestjs/core@12 @nestjs/testing@12 @nestjs/platform-fastify@12 @nestjs/terminus@12 ioredis@6 reflect-metadata@0.2 fastify@5
          pnpm --filter "./packages/*" add -D @nestjs/common@12 @nestjs/core@12 ioredis@6
          pnpm --filter "@songkeys/nestjs-redis-health" add -D @nestjs/terminus@12
      - name: Validate latest dependency compatibility
        if: matrix.dependencies == 'latest'
        run: |
          pnpm -r lint
          pnpm -r build
          node --test scripts/compatibility.test.cjs
      - if: always()
        run: docker compose down -v
