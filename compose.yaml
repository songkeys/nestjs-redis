    command: redis-server --port 16481 --bind 0.0.0.0 --protected-mode no --cluster-enabled yes --cluster-announce-ip 127.0.0.1 --requirepass cluster2 --masterauth cluster2 --save "" --appendonly no
  cluster-2_master-3:
    <<: *redis
    environment:
      REDIS_PORT: 16482
      REDISCLI_AUTH: cluster2
    command: redis-server --port 16482 --bind 0.0.0.0 --protected-mode no --cluster-enabled yes --cluster-announce-ip 127.0.0.1 --requirepass cluster2 --masterauth cluster2 --save "" --appendonly no
  redis-1:
    <<: *redis
    environment:
      REDIS_PORT: 6380
    command: redis-server --port 6380 --bind 0.0.0.0 --protected-mode no --maxmemory 16mb --save "" --appendonly no
