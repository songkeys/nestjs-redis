    command: redis-server --port 16480 --bind 0.0.0.0 --protected-mode no --cluster-enabled yes --cluster-announce-ip 127.0.0.1 --requirepass cluster2 --masterauth cluster2 --save "" --appendonly no
  cluster-2_master-2:
    <<: *redis
    environment:
      REDIS_PORT: 16481
