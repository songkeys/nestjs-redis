# Test fixtures use host networking so Redis Cluster advertises reachable ports.
x-redis: &redis
  image: redis:7-alpine
  network_mode: host
  healthcheck:
    test: ['CMD-SHELL', 'redis-cli -p "$$REDIS_PORT" ping | grep -q PONG']
    interval: 1s
    timeout: 3s
    retries: 30

services:
  cluster-1_master-1:
    <<: *redis
    environment:
      REDIS_PORT: 16380
      REDISCLI_AUTH: cluster1
    command: redis-server --port 16380 --bind 0.0.0.0 --protected-mode no --cluster-enabled yes --cluster-announce-ip 127.0.0.1 --requirepass cluster1 --masterauth cluster1 --save "" --appendonly no
  cluster-1_master-2:
    <<: *redis
    environment:
      REDIS_PORT: 16381
      REDISCLI_AUTH: cluster1
    command: redis-server --port 16381 --bind 0.0.0.0 --protected-mode no --cluster-enabled yes --cluster-announce-ip 127.0.0.1 --requirepass cluster1 --masterauth cluster1 --save "" --appendonly no
  cluster-1_master-3:
    <<: *redis
    environment:
      REDIS_PORT: 16382
      REDISCLI_AUTH: cluster1
    command: redis-server --port 16382 --bind 0.0.0.0 --protected-mode no --cluster-enabled yes --cluster-announce-ip 127.0.0.1 --requirepass cluster1 --masterauth cluster1 --save "" --appendonly no
  cluster-2_master-1:
